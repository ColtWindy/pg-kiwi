services:
  postgres:
    build:
      context: .
      target: test
    ports:
      - "6543:5432"
    command: postgres -c shared_preload_libraries=pg_textsearch
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
