name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker compose build

      - name: Start PostgreSQL
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U postgres && break
            sleep 1
          done

      - name: Regression tests
        run: docker compose exec -T postgres su postgres -c "cd /tmp/pg_kiwi && make installcheck"

      - name: Copy regression diffs on failure
        if: failure()
        run: docker compose cp postgres:/tmp/pg_kiwi/regression.diffs ./regression.diffs || true

      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-diffs
          path: regression.diffs

      - name: Cleanup
        if: always()
        run: docker compose down -v
